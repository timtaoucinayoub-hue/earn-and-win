<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شحن الألعاب والأرباح الحقيقية</title>
    
    <!-- مكتبات Firebase الحقيقية -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #09090b; /* خلفية سوداء عميقة تبرز اللون الناري */
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .top-header {
            background: #18181b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c; /* خط ناري فاصل */
        }

        .logo-text {
            font-size: 22px;
            font-weight: 900;
            color: #f97316; /* لون ناري مضيء */
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        #authSection {
            background: #18181b;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #ea580c;
            text-align: center;
            margin-top: 50px;
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.2);
        }

        .google-btn {
            background: white;
            color: #18181b;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #f4f4f5;
        }

        #mainApp {
            display: none;
        }

        .user-card {
            background: #18181b;
            border: 2px solid #ea580c;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(234, 88, 12, 0.15);
        }

        .balance-amount {
            font-size: 34px;
            font-weight: 900;
            color: #f97316;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
        }

        .ladder-section {
            background: #18181b;
            border-radius: 16px;
            border: 2px solid #27272a;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        .ladder-title {
            font-size: 16px;
            color: #f97316;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .ladder-list {
            display: flex;
            justify-content: space-around;
        }

        .ladder-item {
            font-size: 13px;
            font-weight: bold;
        }

        .ladder-rank {
            color: #fbbf24;
            font-weight: 900;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .ladder-user {
            color: #e4e4e7;
            margin-bottom: 2px;
        }

        .ladder-amount {
            color: #22c55e;
            font-weight: 900;
        }

        .earn-btn {
            background: linear-gradient(135deg, #ea580c, #dc2626); /* تدرج ناري قوي */
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
            transition: 0.3s;
        }

        .earn-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #tasksSection {
            display: none;
            background: #18181b;
            border: 2px solid #27272a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .task-card {
            background: #09090b;
            border: 1px solid #3f3f46;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .file-input {
            font-size: 13px;
            margin: 12px 0;
            display: block;
            color: #a1a1aa;
            font-weight: bold;
        }

        .submit-proof {
            background: #ea580c;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 900;
            transition: 0.3s;
        }

        .submit-proof:hover {
            background: #c2410c;
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div class="container" id="authSection">
        <h2 style="color: #f97316; margin-bottom: 8px; font-size: 24px; font-weight: 900;">مرحباً بك في شحن الألعاب</h2>
        <p style="font-size: 14px; color: #a1a1aa; margin-bottom: 25px; font-weight: bold;">سجل دخولك بنقرة واحدة باستخدام حساب جوجل (Gmail)</p>
        
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            تسجيل الدخول باستخدام Google
        </button>
    </div>

    <!-- الواجهة الرئيسية بعد تسجيل الدخول -->
    <div id="mainApp">
        <div class="top-header">
            <div class="logo-text">🔥 شحن الألعاب والأرباح</div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="container">
            <div class="user-card">
                <div style="font-size: 14px; color: #a1a1aa; font-weight: bold;">رصيدك الحالي في الحساب</div>
                <div class="balance-amount">$<span id="userBalance">0.00</span></div>
                <div style="font-size: 13px; color: #e4e4e7; font-weight: bold;" id="userEmailDisplay">البريد: --</div>
            </div>

            <!-- لوحة المتصدرين الحقيقية -->
            <div class="ladder-section">
                <div class="ladder-title">🏆 لوحة المتصدرين</div>
                <div class="ladder-list" id="leaderboardList">
                    <div class="ladder-item" style="color: #a1a1aa;">جاري التحميل...</div>
                </div>
            </div>

            <button class="earn-btn" onclick="toggleTasks()">🔥 قائمة المهام والأرباح</button>

            <div id="tasksSection">
                <h3 style="font-size: 17px; margin-bottom: 12px; color: #f97316; font-weight: 900;">📌 إتمام المهام ورفع الإثبات</h3>
                
                <div class="task-card">
                    <div style="font-size: 14px; font-weight: 900; color: #ffffff;">متابعة صفحة إنستغرام الرسمية (+0.25$)</div>
                    <input type="file" accept="image/*" class="file-input" id="proofFile1">
                    <button class="submit-proof" onclick="completeTask('متابعة إنستغرام', 0.25, 'proofFile1')">إرسال الإثبات إلى تيليجرام</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCe-uOrYBlOlcoi1dbCr6QIwmhA3Thhtwo",
            authDomain: "ayoub-e696a.firebaseapp.com",
            projectId: "ayoub-e696a",
            storageBucket: "ayoub-e696a.firebasestorage.app",
            messagingSenderId: "192510449152",
            appId: "1:192510449152:web:8ad59a5676ebe09c326ae5",
            measurementId: "G-JMGE6WE0C7"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        function loginWithGoogle() {
            let provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                alert("حدث خطأ أثناء تسجيل الدخول: " + error.message);
            });
        }

        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById("authSection").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                document.getElementById("userEmailDisplay").innerText = "البريد: " + user.email;

                checkOrCreateUserInDB(user);
                loadLeaderboard();
            } else {
                document.getElementById("authSection").style.display = "block";
                document.getElementById("mainApp").style.display = "none";
            }
        });

        function checkOrCreateUserInDB(user) {
            let userRef = db.collection("users").doc(user.uid);
            userRef.get().then((doc) => {
                if (!doc.exists) {
                    userRef.set({
                        email: user.email,
                        balance: 0.00,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        updateBalanceUI(0.00);
                    });
                } else {
                    let data = doc.data();
                    updateBalanceUI(data.balance);
                }
            });
        }

        function updateBalanceUI(balance) {
            document.getElementById("userBalance").innerText = balance.toFixed(2);
        }

        function toggleTasks() {
            let ts = document.getElementById("tasksSection");
            ts.style.display = ts.style.display === "block" ? "none" : "block";
        }

        function completeTask(taskName, rewardAmount, fileId) {
            let fileInput = document.getElementById(fileId);
            if (fileInput.files.length === 0) {
                alert("يرجى اختيار صورة لقطة الشاشة (Screenshot) أولاً!");
                return;
            }

            let token = "8616785827:AAF4jsINYX3ZBVRdeuhD7NwVql7B-VoJnVU"; 
            let chatId = "6581550235"; 

            let formData = new FormData();
            formData.append("chat_id", chatId);
            formData.append("photo", fileInput.files[0]);
            formData.append(`caption`, `🔥 إثبات مهمة جديد!\n\n🔹 المهمة: ${taskName}\n👤 المستخدم: ${currentUser.email}`);

            alert("جاري إرسال الإثبات وتحديث الرصيد...");

            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    let userRef = db.collection("users").doc(currentUser.uid);
                    db.runTransaction((transaction) => {
                        return transaction.get(userRef).then((doc) => {
                            if (!doc.exists) throw "المستخدم غير موجود!";
                            let newBalance = (doc.data().balance || 0) + rewardAmount;
                            transaction.update(userRef, { balance: newBalance });
                            return newBalance;
                        });
                    }).then((newBalance) => {
                        updateBalanceUI(newBalance);
                        loadLeaderboard(); 
                        alert("تم إرسال الإثبات بنجاح وإضافة المكافأة إلى رصيدك!");
                        fileInput.value = "";
                    }).catch((err) => {
                        console.error(err);
                        alert("تم إرسال الإثبات، لكن حدث خطأ في تحديث الرصيد.");
                    });

                } else {
                    alert("حدث خطأ أثناء إرسال الصورة إلى تيليجرام.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("فشل الاتصال بالشبكة.");
            });
        }

        function loadLeaderboard() {
            let leaderboardList = document.getElementById("leaderboardList");
            db.collection("users").orderBy("balance", "desc").limit(3).get()
            .then((querySnapshot) => {
                let html = "";
                let rankSymbols = ["1st 🥇", "2nd 🥈", "3rd 🥉"];
                let index = 0;
                
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let username = data.email.split('@')[0];
                    html += `
                        <div class="ladder-item">
                            <div class="ladder-rank">${rankSymbols[index] || ''}</div>
                            <div class="ladder-user">${username}</div>
                            <div class="ladder-amount">$${(data.balance || 0).toFixed(2)}</div>
                        </div>
                    `;
                    index++;
                });

                if(html !== "") {
                    leaderboardList.innerHTML = html;
                } else {
                    leaderboardList.innerHTML = "<div class='ladder-item' style='color: #a1a1aa;'>لا يوجد متصدرين بعد</div>";
                }
            })
            .catch((error) => {
                console.log("Error getting leaderboard: ", error);
            });
        }
    </script>
</body>
</html>
