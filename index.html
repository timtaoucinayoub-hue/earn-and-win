<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة شحن الألعاب والأرباح الحقيقية</title>
    
    <!-- مكتبات Firebase الحقيقية -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a; /* خلفية داكنة عصرية للألعاب */
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* شريط العلوي الفاخر */
        .top-header {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* قسم تسجيل الدخول الحقيقي */
        #authSection {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            margin-top: 50px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .auth-btn {
            background: #3b82f6;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-btn.register {
            background: #10b981;
        }

        /* محتوى الموقع الأساسي (يظهر بعد تسجيل الدخول) */
        #mainApp {
            display: none;
        }

        .user-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            margin: 10px 0;
        }

        /* لوحة المتصدرين الوهمية */
        .ladder-section {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .ladder-item {
            font-size: 11px;
        }

        .ladder-rank {
            color: #f59e0b;
            font-weight: bold;
        }

        .ladder-user {
            color: #38bdf8;
        }

        .ladder-amount {
            color: #10b981;
            font-weight: bold;
        }

        /* الزر الأخضر الرئيسي "أرباح" */
        .earn-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* قسم المهام */
        #tasksSection {
            display: none;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .task-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-input {
            font-size: 11px;
            margin: 8px 0;
            display: block;
            color: #94a3b8;
        }

        .submit-proof {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول الحقيقي -->
    <div class="container" id="authSection">
        <h2 style="color: #38bdf8; margin-bottom: 5px;">تسجيل الدخول للحساب</h2>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">أنشئ حساباً حقيقياً أو سجل دخولك لمتابعة الأرباح</p>
        
        <input type="email" id="email" class="auth-input" placeholder="البريد الإلكتروني">
        <input type="password" id="password" class="auth-input" placeholder="كلمة المرور">
        
        <button class="auth-btn" onclick="login()">تسجيل الدخول</button>
        <button class="auth-btn register" onclick="register()">إنشاء حساب جديد</button>
    </div>

    <!-- الواجهة الرئيسية بعد تسجيل الدخول -->
    <div id="mainApp">
        <div class="top-header">
            <div class="logo-text">🎮 شحن الألعاب</div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="container">
            <!-- كارت الرصيد -->
            <div class="user-card">
                <div style="font-size: 13px; color: #94a3b8;">رصيدك الحالي في الحساب</div>
                <div class="balance-amount">$<span id="userBalance">0.00</span></div>
                <div style="font-size: 11px; color: #cbd5e1;" id="userEmailDisplay">البريد: --</div>
            </div>

            <!-- لوحة المتصدرين -->
            <div class="ladder-section">
                <div class="ladder-item">
                    <div class="ladder-rank">1st 🇺🇸</div>
                    <div class="ladder-user">tby3sor</div>
                    <div class="ladder-amount">$125.45</div>
                </div>
                <div class="ladder-item">
                    <div class="ladder-rank">2nd 🇺🇸</div>
                    <div class="ladder-user">tb3es29</div>
                    <div class="ladder-amount">$46.80</div>
                </div>
                <div class="ladder-item">
                    <div class="ladder-rank">3rd 🇷🇴</div>
                    <div class="ladder-user">tb21589</div>
                    <div class="ladder-amount">$42.76</div>
                </div>
            </div>

            <!-- زر أرباح الكبير -->
            <button class="earn-btn" onclick="toggleTasks()">أرباح (قائمة المهام)</button>

            <!-- قسم المهام وإرسال الإثبات -->
            <div id="tasksSection">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: #38bdf8;">📌 إتمام المهام ورفع الإثبات</h3>
                
                <div class="task-card">
                    <div style="font-size: 13px; font-weight: bold;">متابعة صفحة إنستغرام الرسمية (+0.25$)</div>
                    <input type="file" accept="image/*" class="file-input" id="proofFile1">
                    <button class="submit-proof" onclick="sendProofToTelegram('متابعة إنستغرام', 'proofFile1')">إرسال الإثبات إلى تيليجرام</button>
                </div>

                <div class="task-card">
                    <div style="font-size: 13px; font-weight: bold;">الاشتراك في قناة تيليجرام (+0.20$)</div>
                    <input type="file" accept="image/*" class="file-input" id="proofFile2">
                    <button class="submit-proof" onclick="sendProofToTelegram('اشتراك تيليجرام', 'proofFile2')">إرسال الإثبات إلى تيليجرام</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إعدادات مشروعك الحقيقي على Firebase الدمج الكامل
        const firebaseConfig = {
            apiKey: "AIzaSyCe-uOrYBlOlcoi1dbCr6QIwmhA3Thhtwo",
            authDomain: "ayoub-e696a.firebaseapp.com",
            projectId: "ayoub-e696a",
            storageBucket: "ayoub-e696a.firebasestorage.app",
            messagingSenderId: "192510449152",
            appId: "1:192510449152:web:8ad59a5676ebe09c326ae5",
            measurementId: "G-JMGE6WE0C7"
        };

        // تهيئة Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUserEmail = "";

        // دالة تسجيل حساب جديد
        function register() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;

            if(!email || !pass) {
                alert("يرجى إدخال البريد وكلمة المرور!");
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    alert("تم إنشاء الحساب بنجاح!");
                })
                .catch((error) => {
                    alert("خطأ: " + error.message);
                });
        }

        // دالة تسجيل الدخول
        function login() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;

            if(!email || !pass) {
                alert("يرجى إدخال البريد وكلمة المرور!");
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    alert("مرحباً بك مجدداً!");
                })
                .catch((error) => {
                    alert("فشل تسجيل الدخول، تأكد من البيانات.");
                });
        }

        // دالة تسجيل الخروج
        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        // مراقبة حالة المستخدم
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserEmail = user.email;
                document.getElementById("authSection").style.display = "none";
                document.getElementById("mainApp").style.display = "block";
                document.getElementById("userEmailDisplay").innerText = "البريد: " + user.email;
            } else {
                document.getElementById("authSection").style.display = "block";
                document.getElementById("mainApp").style.display = "none";
            }
        });

        // إظهار وإخفاء قسم المهام
        function toggleTasks() {
            let ts = document.getElementById("tasksSection");
            ts.style.display = ts.style.display === "block" ? "none" : "block";
        }

        // إرسال الإثبات إلى بوت تيليجرام
        function sendProofToTelegram(taskName, fileId) {
            let fileInput = document.getElementById(fileId);
            if (fileInput.files.length === 0) {
                alert("يرجى اختيار صورة لقطة الشاشة (Screenshot) أولاً!");
                return;
            }

            let token = "8616785827:AAF4jsINYX3ZBVRdeuhD7NwVql7B-VoJnVU"; 
            let chatId = "6581550235"; 

            let formData = new FormData();
            formData.append("chat_id", chatId);
            formData.append("photo", fileInput.files[0]);
            formData.append("caption", `📌 إثبات مهمة جديد (حساب حقيقي)!\n\n🔹 المهمة: ${taskName}\n👤 المستخدم: ${currentUserEmail}`);

            alert("جاري إرسال الإثبات...");

            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert("تم إرسال الإثبات بنجاح إلى تيليجرام!");
                    fileInput.value = "";
                } else {
                    alert("حدث خطأ أثناء الإرسال.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("فشل الاتصال بالشبكة.");
            });
        }
    </script>
</body>
</html>
