<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="موقع عجلة الحظ للربح، أدر واربح الجوائز، ادعُ أصدقاءك، واطلب سحب أرباحك عبر بريدي موب، فري فاير، ببجي، باي بال، وفيزا.">
    <meta name="keywords" content="عجلة الحظ, ربح المال, بريدي موب, شحن فري فاير, شحن ببجي, باي بال, فيزا">
    <title>عجلة الحظ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff8c00;
            --accent-hover: #e07b00;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        /* الهيدر ومعلومات المستخدم */
        .header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .site-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: bold;
        }
        .user-id {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        /* مربعات الأرصدة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #252525;
            padding: 8px 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .stat-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        /* شريط التقدم للسحب */
        .progress-section {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .progress-bar-bg {
            background: var(--border-color);
            border-radius: 6px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        /* الأقسام الأربعة في الأسفل */
        .sections-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card-title {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        /* عناصر خانة الدعوات */
        .ref-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .ref-input {
            flex: 1;
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            color: var(--text-color);
            font-size: 0.85rem;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        /* عناصر عجلة الحظ */
        .wheel-container {
            text-align: center;
        }
        .wheel-result {
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            min-height: 30px;
        }
        /* طرق السحب */
        .withdraw-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .method-btn {
            background: #252525;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }
        .method-btn:hover {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر ومعلومات الأرصدة -->
        <div class="header">
            <div class="top-bar">
                <div class="site-title">عجلة الحظ</div>
                <div class="user-id">UserID: <span id="userIdDisplay">229685753</span></div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-title">Rewards</div>
                    <div class="stat-value" id="rewardsVal">$0.000</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Referral</div>
                    <div class="stat-value" id="referralVal">$0.000</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Bonus</div>
                    <div class="stat-value" id="bonusVal">$0.000</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Total</div>
                    <div class="stat-value" id="totalVal">$0.000</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">$5.00 UNTIL CASH OUT!</div>
            </div>
        </div>

        <!-- الخانات الأربعة في الأسفل -->
        <div class="sections-container">
            
            <!-- 1. خانة الدعوات -->
            <div class="card-section">
                <div class="card-title">دعوات الأصدقاء</div>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">شارك رابطك الخاص واكسب أرباحاً إضافية:</p>
                <div class="ref-input-group">
                    <input type="text" class="ref-input" id="refLink" value="https://timtaoucinayoub-hue.github.io/?ref=229685753" readonly>
                    <button class="btn" onclick="copyRefLink()">نسخ</button>
                </div>
            </div>

            <!-- 2. خانة المهام -->
            <div class="card-section">
                <div class="card-title">المهام اليومية</div>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px;">أتمم المهام واجمع المكافآت لحسابك.</p>
                <button class="btn" style="width: 100%;" onclick="alert('لا توجد مهام متاحة حالياً، عُد لاحقاً!')">إنجاز المهام</button>
            </div>

            <!-- 3. خانة عجلة الحظ (أدر واربح) -->
            <div class="card-section wheel-container">
                <div class="card-title" style="text-align: right;">أدر واربح</div>
                <div class="wheel-result" id="wheelResult">اضغط على الزر لتدوير العجلة!</div>
                <button class="btn" style="width: 100%; padding: 12px;" onclick="spinWheel()">أدر العجلة الآن</button>
            </div>

            <!-- 4. خانة طرق السحب -->
            <div class="card-section">
                <div class="card-title">طرق السحب (الحد الأدنى $5)</div>
                <div class="withdraw-methods">
                    <button class="method-btn" onclick="requestWithdraw('بريدي موب')">بريدي موب</button>
                    <button class="method-btn" onclick="requestWithdraw('شحن فري فاير')">شحن فري فاير</button>
                    <button class="method-btn" onclick="requestWithdraw('شحن ببجي')">شحن ببجي</button>
                    <button class="method-btn" onclick="requestWithdraw('باي بال')">باي بال (PayPal)</button>
                </div>
                <button class="method-btn" style="width: 100%; margin-top: 8px;" onclick="requestWithdraw('بطاقة فيزا')">بطاقة فيزا (Visa)</button>
            </div>

        </div>
    </div>

    <script>
        // المتغيرات المالية الأساسية
        let totalEarnings = 0.000;

        function updateUI() {
            document.getElementById('totalVal').innerText = '$' + totalEarnings.toFixed(3);
            document.getElementById('rewardsVal').innerText = '$' + totalEarnings.toFixed(3);
            
            // حساب شريط التقدم بالنسبة للحد الأدنى 5 دولار
            let percentage = (totalEarnings / 5.0) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('progressFill').style.width = percentage + '%';

            let remaining = 5.0 - totalEarnings;
            if (remaining < 0) remaining = 0;
            document.getElementById('progressText').innerText = '$' + remaining.toFixed(2) + ' UNTIL CASH OUT!';
        }

        // دالة نسخ رابط الإحالة
        function copyRefLink() {
            const refInput = document.getElementById('refLink');
            refInput.select();
            refInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(refInput.value);
            alert('تم نسخ رابط الدعوة بنجاح!');
        }

        // عجلة الحظ بنظام الاحتمالات (الأعداد الكبيرة نادرة جداً)
        function spinWheel() {
            // القيم المتاحة: 0.01, 0.05, 0.1, 1, 3
            const rand = Math.random();
            let prize = 0.01;

            if (rand < 0.60) {
                prize = 0.01; // نسبة 60%
            } else if (rand < 0.85) {
                prize = 0.05; // نسبة 25%
            } else if (rand < 0.96) {
                prize = 0.10; // نسبة 11%
            } else if (rand < 0.99) {
                prize = 1.00; // نسبة 3% (نادرة)
            } else {
                prize = 3.00; // نسبة 1% (نادرة جداً)
            }

            totalEarnings += prize;
            updateUI();
            document.getElementById('wheelResult').innerText = `مبروك! ربحت: $${prize.toFixed(2)}`;
        }

        // دالة طلب السحب مع شرط الحد الأدنى 5 دولار
        function requestWithdraw(method) {
            if (totalEarnings < 5.0) {
                alert(`عذراً، الحد الأدنى للسحب هو $5. رصيدك الحالي هو $${totalEarnings.toFixed(3)}. استمر في التدوير والجمع!`);
            } else {
                alert(`تم تقديم طلب السحب بنجاح عبر ${method}! سيتم مراجعة طلبك وإرسال الأموال.`);
            }
        }

        // تشغيل التحديث الأولي عند فتح الصفحة
        updateUI();
    </script>
</body>
</html>
