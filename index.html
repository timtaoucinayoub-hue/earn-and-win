<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الربح الذكي | Earn & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .balance-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 12px;
            text-align: center;
        }

        .balance-box span {
            color: var(--accent-gold);
            font-weight: 900;
            font-size: 1.1rem;
        }

        button {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-green {
            background: var(--accent-green);
            color: #fff;
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .admin-pending-item {
            background: rgba(245,158,11,0.05);
            border: 1px solid var(--accent-gold);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="auth-section" class="section active">
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 style="color: var(--accent-gold); font-size: 1.8rem; margin-bottom: 8px;">Earn & Win</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">منصتك الموثوقة لجمع الأرباح والمهام</p>
            </div>
            <button onclick="loginWithGoogle()" class="btn-green">تسجيل الدخول باستخدام Google</button>
        </div>

        <!-- لوحة المستخدم الرئيسية -->
        <div id="app-section" class="section">
            <div class="header">
                <div>
                    <h3 id="user-name" style="font-size: 1.1rem;">مرحباً</h3>
                    <p style="font-size: 0.75rem; color: var(--text-muted);" id="user-email"></p>
                </div>
                <div class="balance-box">
                    <small style="display:block; color:var(--text-muted); font-size: 0.7rem;">الرصيد المعتمد</small>
                    <span id="user-balance">0.00</span> دج
                </div>
            </div>

            <!-- قسم مهام إنستغرام مع نظام المراجعة اليدوية -->
            <div class="card">
                <h4 style="margin-bottom: 8px; color: var(--accent-gold);">🎯 مهمة إنستغرام اليومية</h4>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">قم بمتابعة حسابنا وأدخل اسم حسابك ليتم مراجعته وإضافة المكافأة يدويًا.</p>
                <input type="text" id="insta-username" placeholder="@اسم_المستخدم_خاصتك">
                <button onclick="submitTask()">إرسال للمراجعة</button>
                <p id="task-status" style="font-size: 0.8rem; color: var(--accent-gold); margin-top: 8px; text-align: center;"></p>
            </div>

            <!-- زر لوحة تحكم الأدمن (يظهر حصرياً لبريدك) -->
            <button id="admin-nav-btn" onclick="switchSection('admin-section')" class="hidden" style="background: #1e293b; color: var(--accent-gold); border: 1px solid var(--accent-gold);">🛡️ لوحة تحكم الأدمن (مراجعة الطلبات)</button>
            <button onclick="logout()" class="btn-danger" style="margin-top: 15px;">تسجيل الخروج</button>
        </div>

        <!-- لوحة تحكم الأدمن -->
        <div id="admin-section" class="section">
            <h2 style="color: var(--accent-gold); margin-bottom: 15px; font-size: 1.3rem;">🛡️ إدارة طلبات المستخدمين</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">المهام المرسلة تنتظر موافقتك لإضافة الأرصدة:</p>
            
            <div id="admin-tasks-list">
                <p style="text-align: center; color: var(--text-muted);">جاري تحميل الطلبات...</p>
            </div>

            <button onclick="switchSection('app-section')" style="background: #334155; color: #fff; margin-top: 15px;">العودة للرئيسية</button>
        </div>
    </div>

    <!-- Firebase والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // تم دمج إعدادات مشروعك الحقيقية هنا بدقة
        const firebaseConfig = {
            apiKey: "AIzaSyCe-uOrYBlOlcoi1dbCr6QIwmhA3Thhtwo",
            authDomain: "ayoub-e696a.firebaseapp.com",
            projectId: "ayoub-e696a",
            storageBucket: "ayoub-e696a.firebasestorage.app",
            messagingSenderId: "192510449152",
            appId: "1:192510449152:web:e24419a5de476e1c326ae5",
            measurementId: "G-7Y00QEC7DL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // بريدك الإلكتروني المعتمد للأدمن بحروف صغيرة صحيحة
        const ADMIN_EMAIL = "timtaoucinayoub@gmail.com"; 

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("خطأ في تسجيل الدخول: " + error.message);
            }
        };

        window.logout = () => signOut(auth);

        window.switchSection = (sectionId) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            if(sectionId === 'admin-section') loadAdminTasks();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-email').innerText = user.email;
                switchSection('app-section');

                // التحقق من صلاحيات الأدمن
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('admin-nav-btn').classList.remove('hidden');
                } else {
                    document.getElementById('admin-nav-btn').classList.add('hidden');
                }

                // جلب أو إنشاء بيانات المستخدم في Firestore
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        name: user.displayName,
                        email: user.email,
                        balance: 0
                    });
                    document.getElementById('user-balance').innerText = "0.00";
                } else {
                    document.getElementById('user-balance').innerText = userSnap.data().balance || 0;
                }

            } else {
                switchSection('auth-section');
            }
        });

        // إرسال المهمة
        window.submitTask = async () => {
            const user = auth.currentUser;
            const instaInput = document.getElementById('insta-username').value.trim();
            if(!instaInput) {
                alert("الرجاء إدخال اسم المستخدم الخاص بك");
                return;
            }

            const taskRef = doc(db, "tasks_submissions", `${user.uid}_${Date.now()}`);
            await setDoc(taskRef, {
                uid: user.uid,
                name: user.displayName,
                insta: instaInput,
                status: "pending",
                timestamp: Date.now()
            });

            document.getElementById('task-status').innerText = "تم الإرسال بنجاح! سيتم مراجعته وإضافة الرصيد قريباً.";
            document.getElementById('insta-username').value = "";
        };

        // تحميل مهام الأدمن المعلقة
        window.loadAdminTasks = async () => {
            const listEl = document.getElementById('admin-tasks-list');
            listEl.innerHTML = "<p style='text-align: center; color: var(--text-muted);'>جاري التحميل...</p>";

            const q = query(collection(db, "tasks_submissions"), where("status", "==", "pending"));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                listEl.innerHTML = "<p style='text-align: center; color: var(--text-muted);'>لا توجد طلبات معلقة حالياً.</p>";
                return;
            }

            let html = "";
            querySnapshot.forEach((document) => {
                const data = document.data();
                html += `
                    <div class="admin-pending-item">
                        <p style="font-size: 0.9rem;"><strong>المستخدم:</strong> ${data.name}</p>
                        <p style="font-size: 0.9rem;"><strong>إنستغرام:</strong> ${data.insta}</p>
                        <button onclick="approveTask('${document.id}', '${data.uid}')" class="btn-green" style="margin-top:6px; padding: 8px;">موافقة وإضافة 100 دج</button>
                        <button onclick="rejectTask('${document.id}')" class="btn-danger" style="margin-top:4px; padding: 8px;">رفض</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        };

        // الموافقة وإضافة الأرباح بحساب المستخدم
        window.approveTask = async (taskId, targetUid) => {
            try {
                await updateDoc(doc(db, "tasks_submissions", taskId), { status: "approved" });
                
                const targetUserRef = doc(db, "users", targetUid);
                await updateDoc(targetUserRef, {
                    balance: increment(100)
                });

                alert("تمت الموافقة بنجاح وأُضيف الرصيد لحساب المستخدم!");
                loadAdminTasks();
            } catch (e) {
                alert("حدث خطأ: " + e.message);
            }
        };

        // رفض الطلب
        window.rejectTask = async (taskId) => {
            await updateDoc(doc(db, "tasks_submissions", taskId), { status: "rejected" });
            alert("تم رفض الطلب.");
            loadAdminTasks();
        };
    </script>
</body>
</html>
